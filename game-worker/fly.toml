# fly.toml for riddleverse-game-worker (RiddleVerse game generation worker, server.js).
# Secrets (names only, set with `flyctl secrets import`): WORKER_SECRET, ANTHROPIC_API_KEY.
# The worker reads them once at startup (entrypoint.sh hands them over in a node-only file) and the Claude CLI never sees them, see agentSandbox.js.
# GITHUB_PAT is intentionally NOT set: repo features (init-repo, versions, customize persistence) stay disabled.
app = 'riddleverse-game-worker'
primary_region = 'sjc'

[build]

[env]
  WORKER_PORT = '3456'

[http_service]
  internal_port = 3456
  force_https = true
  # 'suspend' only supports machines up to 2 GB, this one has 4 GB, so it stops when idle
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # server.js allows 2 concurrent builds (MAX_CONCURRENT) and answers 429 itself above that.
  # Keep the proxy limits at or just above that so the app's own 429 is what callers see.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 3

  # Builds are SSE streams of several minutes. server.js writes a ':heartbeat' comment every 15 s,
  # which keeps Fly's proxy idle timeout (60 s) from cutting the stream.
  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '10s'

[[vm]]
  # Each build runs the Claude CLI plus chromium for the runtime check, two builds can overlap: 4 GB.
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
